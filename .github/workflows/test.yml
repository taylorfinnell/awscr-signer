name: Test
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: 13 1 * * 6
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crystal_version: ${{ github.event_name == 'schedule' && fromJSON('["latest"]') || fromJSON('["1.12.2", "1.13.3", "1.14.1", "1.15.1", "1.16.3", "1.17.1", "1.18.2", "1.19.2", "1.20.3", "1.21.1", "latest"]') }}
        experimental: [false]
        include:
          - crystal_version: nightly
            experimental: true
    name: Crystal ${{ matrix.crystal_version }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - name: "[Git] Checkout code"
        uses: actions/checkout@v4

      - uses: crystal-lang/install-crystal@v1
        name: "[Setup] Install Crystal"
        with:
          crystal: ${{ matrix.crystal_version }}

      - name: "[Setup] Install dependencies"
        run: shards install

      - name: "[Test] Run specs"
        run: crystal spec -v --error-trace

      - name: "[Test] Smoke tests"
        env:
          LOG_LEVEL: TRACE
        run: |
          crystal run --release --stats --progress examples/request_signing_v4.cr
          crystal run --release --stats --progress examples/request_signing_v2.cr
